{"name": "Build Clipper APK",
"on": {"push": null, "workflow_dispatch": null},
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"run": "unzip -o app.zip"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.14.3"}},
{"working-directory": "clipper", "run": "gradle assembleDebug --no-daemon"},
{"run": "cp clipper/app/build/outputs/apk/debug/app-debug.apk Clipper.apk"},
{"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "files": "Clipper.apk"}}
]}}}
